<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória - Seleção Brasileira 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Memória da Seleção 2026 🇧🇷</h1>
        <p>Encontre os pares dos craques do Brasil!</p>
    </header>

    <main class="game-container">
        <!-- O tabuleiro será gerado dinamicamente via JS -->
    </main>

    <div class="win-screen" id="winScreen">
        <div class="win-box">
            <h2>Parabéns! 🎉</h2>
            <p>Você encontrou todos os jogadores da Copa de 2026!</p>
            <button onclick="resetGame()">Jogar Novamente</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
